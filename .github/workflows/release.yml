name: release
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    name: publish releases
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Golang
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test release packaging
        run: python3 scripts/test_release.py
      - name: Build and Release
        run: make release BUILD_KIND=release UPDATE_ENABLED=true RELEASE_REPO="$GITHUB_REPOSITORY" REPO="$GITHUB_REPOSITORY" BUILD_VERSION="$GITHUB_REF_NAME"
      - name: Upload to release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
