name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.1 ./...
      - run: go test -race ./...
      - name: Cross-compile all release platforms
        if: runner.os == 'Linux'
        run: make all
      - name: Test release packaging
        if: runner.os == 'Linux'
        run: python3 scripts/test_release.py
